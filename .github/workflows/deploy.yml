name: Build and Verify Aimotech Landing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Astro Types and Components
        run: npx astro check

      - name: Build Static Site
        run: npm run build

      - name: Verify Root Index.html Integrity
        run: |
          test -f dist/index.html
          test -f index.html
          echo "Static build verified successfully."
